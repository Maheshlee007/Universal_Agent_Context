<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UAC</title>
<style>
:root{color-scheme:light dark;--bg:#fafafa;--fg:#1d1f23;--mut:#6b7079;--bd:#dcdfe4;--card:#fff;--acc:#2f6fd6;--ok:#1f8a4c;--bad:#c93a3a;--warn:#b7791f;--hl:#eef3fc}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#e3e5e8;--mut:#8b919a;--bd:#2c3036;--card:#1c1f23;--acc:#5b93ea;--ok:#3fb56f;--bad:#e25c5c;--warn:#d9a441;--hl:#232a36}}
*{box-sizing:border-box}
body{margin:0;font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:0;z-index:2}
header b{font-size:14px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:6px 10px;color:var(--mut)}
nav button.on{color:var(--fg);border-bottom-color:var(--acc)}
.badge{display:inline-block;min-width:16px;padding:0 5px;margin-left:4px;border-radius:8px;background:var(--bad);color:#fff;font-size:11px;text-align:center}
.badge:empty{display:none}
main{padding:14px;max-width:1100px}
button,select,input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:3px 8px}
button{cursor:pointer}button:hover{border-color:var(--acc)}button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.dng{color:var(--bad)}
button.armed{background:var(--bad);border-color:var(--bad);color:#fff}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
textarea{width:100%;min-height:60px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:12px}
input[type=text]{width:100%}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:500;font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:14px}
.card.nextc{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.card.focus,.mem.focus{outline:2px solid var(--acc)}
.banner{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta{color:var(--mut);font-size:12px}
pre,.mbody{white-space:pre-wrap;word-break:break-word;margin:4px 0;font:12px/1.4 ui-monospace,Consolas,monospace}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:10px}
.tile .n{font-size:22px;font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:800px){.split{grid-template-columns:1fr}}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.bar input[type=text]{width:240px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sh{display:flex;gap:8px;align-items:baseline;cursor:pointer}
.sh .n{color:var(--mut);font-variant-numeric:tabular-nums}
.sh h3{flex:1}
.pill{display:inline-block;padding:0 6px;margin-left:4px;border-radius:9px;font-size:11px;border:1px solid var(--bd);color:var(--mut);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.bad{color:var(--bad);border-color:var(--bad)}.pill.acc{color:var(--acc);border-color:var(--acc)}
.st{padding:0 6px;border-radius:3px;font-size:11px;border:1px solid var(--bd)}
.st-active{color:var(--ok)}.st-proposed{color:var(--acc)}.st-stale{color:var(--warn)}.st-conflict{color:var(--bad)}.st-superseded,.st-archived{color:var(--mut)}
.mem{padding:8px 0}.mem+.mem{border-top:1px solid var(--bd)}
.mem .mbody{font-family:inherit;font-size:13px;max-height:9em;overflow:auto}
.card.dim{opacity:.55}.card.dim:hover{opacity:.85}
.card.rolled{border-style:dashed}
.sh input.ren{flex:1;width:auto;font-size:14px}
.pick{margin:0}
.nexttog{display:flex;gap:4px;align-items:center;font-size:12px;white-space:nowrap;cursor:pointer}
#toast{position:fixed;bottom:14px;right:12px;max-width:480px;background:var(--bad);color:#fff;padding:8px 12px;border-radius:6px;display:none;cursor:pointer;z-index:5}
#toast.ok{background:var(--ok)}
.empty{color:var(--mut);padding:12px 0}
ul{margin:4px 0;padding-left:18px}
td.ev div{max-height:7em;overflow:auto;white-space:pre-wrap;word-break:break-word;font:12px/1.4 ui-monospace,Consolas,monospace}
details>summary{cursor:pointer;color:var(--mut);margin-top:6px}
.msglist{max-height:65vh;overflow-y:auto;padding-right:4px}
.card.msg .banner button{padding:0 6px}
details.acc{border:1px solid var(--bd);border-radius:6px;background:var(--card);margin-bottom:6px}
details.acc>summary{margin:0;padding:7px 10px;color:var(--fg);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
details.acc>summary b{text-transform:capitalize}
details.acc[open]>summary{border-bottom:1px solid var(--bd)}
details.acc>:not(summary){margin:8px 10px}
details.acc .card{border:0;padding:0;margin:0}
h2{font-size:13px;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.04em}
h4{margin:10px 0 4px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
label.mode{display:block;padding:6px 0}
label.mode .meta{display:block;margin-left:22px}
.grid{display:grid;grid-template-columns:80px 1fr;gap:6px 10px;align-items:start}
.grid>span{color:var(--mut);padding-top:3px}
</style>
</head>
<body>
<header>
  <b>UAC</b>
  <select id="proj" title="Project"></select>
  <nav id="tabs"></nav>
  <button id="refresh" title="Reload everything from the UAC store (new sessions, messages, knowledge)" style="margin-left:auto">⟳ Refresh</button>
</header>
<main id="main"></main>
<div id="toast" title="Click to dismiss"></div>
<script>
'use strict';
// No confirm()/alert()/prompt(): they are suppressed in the VS Code webview. Destructive actions use twoStep().
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const TYPES = ['overview','architecture','decision','constraint','requirement','lesson','warning','fact','preference','idea','task'];
const TABS = [['sessions','Sessions'],['knowledge','Knowledge'],['messages','Messages'],['project','Project']];
const MODES = [
  ['off', 'UAC does nothing here: no context is loaded and nothing is recorded.'],
  ['manual', "Project knowledge and this branch's latest session card load at start; nothing is recorded until you type #uac on."],
  ['automatic', 'Knowledge loads at start, and every session is recorded and saved into a session card automatically.'],
];
const main = document.getElementById('main');
let project = new URLSearchParams(location.search).get('project') || localStorage.getItem('uac.project') || ''; // ?project=<id> opens that project
let projects = [];
let tab = 'sessions';
let seq = 0;             // render generation; stale async renders bail out
let pollFn = null;       // sessions tab refresher
let focusMem = null;     // #memories/<id>
let focusSess = null;    // #sessions/<id>
const openCards = new Set();   // expanded session cards survive polling
const openEvents = new Set();  // expanded raw-events lists
const dcache = new Map();      // session id -> /api/sessions/:id detail
const sf = { branch: '', rolled: false, into: '', notice: null };
const picked = new Set();      // session ids ticked for merge / rollup
const kf = { q: '', all: false, open: null }; // open = the one expanded knowledge section

function readHash() {
  const [t, raw] = location.hash.slice(1).split('/');
  const id = raw && decodeURIComponent(raw);
  const k = t === 'memories' || t === 'review' ? 'knowledge' : t;
  if (TABS.some(([x]) => x === k)) tab = k;
  focusMem = t === 'memories' && id ? id : null;
  focusSess = t === 'sessions' && id ? id : null;
  if (focusSess) openCards.add(focusSess);
}
readHash();

// Build DOM safely: strings become text nodes, never HTML.
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c instanceof Node ? c : String(c));
  return e;
}
function toast(msg, ok) { const el = document.getElementById('toast'); el.textContent = msg; el.className = ok ? 'ok' : ''; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', ok ? 3000 : 8000); }
document.getElementById('toast').onclick = (e) => e.target.style.display = 'none';

async function api(path, method = 'GET', body) {
  const opt = { method, headers: { 'x-uac-token': TOKEN } };
  if (body !== undefined) { opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => null);
  if (!r.ok) throw new Error(`${method} ${path.split('?')[0]}: ${(data && (data.error || data.message)) || r.status + ' ' + r.statusText}`);
  return data;
}
const P = (path, params = {}) => path + '?' + new URLSearchParams(Object.entries({ project, ...params }).filter(([, v]) => v !== '' && v != null));
const enc = encodeURIComponent;
const toDate = (t) => { const n = Number(t); return new Date(isNaN(n) ? t : n < 1e12 ? n * 1000 : n); };
const fmt = (t) => { if (t == null || t === '') return ''; const d = toDate(t); return isNaN(d) ? String(t) : d.toLocaleString(); };
function ago(t) {
  if (t == null || t === '') return '';
  const d = toDate(t); if (isNaN(d)) return String(t);
  const s = (Date.now() - d) / 1000;
  return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : s < 7 * 86400 ? Math.round(s / 86400) + 'd ago' : d.toLocaleDateString();
}
const arr = (v) => { if (Array.isArray(v)) return v; if (typeof v === 'string' && /^\s*[\[{]/.test(v)) { try { const p = JSON.parse(v); return Array.isArray(p) ? p : [p]; } catch {} } return v == null || v === '' ? [] : [v]; };
const str = (v) => v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v);
const st = (s) => s ? h('span', { class: 'st st-' + s }, s) : null;
const pill = (text, cls = '', title) => h('span', { class: 'pill ' + cls, title }, text);
const empty = (msg) => h('div', { class: 'empty' }, msg);
const sel = (value, opts, props = {}) => h('select', props, opts.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return h('option', { value: v, selected: v === value }, l); }));
function act(fn) { return async (e) => { if (e) e.stopPropagation(); const b = e && e.currentTarget; if (b) b.disabled = true; try { await fn(e); } catch (err) { toast(err.message); } finally { if (b) b.disabled = false; } }; }
const list = (label, v) => { const a = arr(v); return a.length ? [h('h4', null, label), h('ul', null, a.map(x => h('li', null, str(x))))] : null; };
const text = (label, v) => v ? [h('h4', null, label), h('pre', null, str(v))] : null;
// native replaceChildren stringifies arrays and null; h() flattens, so mirror that
const fill = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter(k => k != null && k !== false));
const sTitle = (s) => s.title || s.card?.title || '(untitled session)';

// "Delete" -> "Confirm delete (…)" -> action. Reverts after 4s. confirmLabel may be an async function.
function twoStep(label, confirmLabel, onConfirm, cls = 'dng') {
  const b = h('button', { class: cls });
  let armed = false, t;
  const reset = () => { armed = false; b.textContent = label; b.className = cls; };
  reset();
  b.addEventListener('click', act(async () => {
    if (!armed) {
      let l = 'Confirm';
      try { l = typeof confirmLabel === 'function' ? await confirmLabel() : confirmLabel; } catch {}
      armed = true; b.textContent = l; b.className = 'armed'; t = setTimeout(reset, 4000); return;
    }
    clearTimeout(t); reset(); await onConfirm();
  }));
  return b;
}

// ---------- chrome ----------
function drawTabs() {
  const nav = document.getElementById('tabs');
  const badge = nav.querySelector('#rbadge')?.textContent || '';
  nav.replaceChildren(...TABS.map(([id, label]) => h('button', { class: id === tab ? 'on' : '', onclick: () => go(id) }, label, id === 'knowledge' ? h('span', { class: 'badge', id: 'rbadge', title: 'Needs your decision' }, badge) : null)));
}
async function updateBadge(r) {
  if (!project) return;
  try { r = r || await api(P('/api/review')); document.getElementById('rbadge').textContent = (arr(r.proposed).length + arr(r.conflicts).length) || ''; } catch {}
}
function setHash() {
  const sub = tab === 'knowledge' && focusMem ? 'memories/' + enc(focusMem) : tab === 'sessions' && focusSess ? 'sessions/' + enc(focusSess) : tab;
  history.replaceState(null, '', location.search + '#' + sub);
}
function go(id) { tab = id; focusMem = focusSess = null; setHash(); drawTabs(); render(); }
window.addEventListener('hashchange', () => { readHash(); drawTabs(); render(); });
async function render() {
  const my = ++seq;
  pollFn = null;
  if (!project) { main.replaceChildren(empty('No projects yet. Start a session in a project with UAC installed.')); return; }
  const out = h('div');
  try { await VIEWS[tab](out, () => my === seq); } catch (e) { out.replaceChildren(empty(e.message)); }
  if (my === seq) main.replaceChildren(out);
  const f = focusMem ? document.getElementById('m-' + focusMem) : focusSess ? document.getElementById('s-' + focusSess) : null;
  if (f && my === seq) f.scrollIntoView({ block: 'center' });
}
async function loadProjects() {
  projects = await api('/api/projects');
  const pick = document.getElementById('proj');
  if (!projects.some(p => p.id === project)) project = projects[0]?.id || '';
  pick.replaceChildren(...projects.map(p => h('option', { value: p.id, selected: p.id === project, title: p.root }, p.name || p.root)));
  pick.onchange = () => { project = pick.value; localStorage.setItem('uac.project', project); openCards.clear(); dcache.clear(); picked.clear(); sf.branch = ''; sf.notice = null; go(tab); updateBadge(); };
}

// ---------- views ----------
const VIEWS = {
  async sessions(out, live) {
    const banner = h('div', { class: 'card banner' }), notice = h('div'), bar = h('div', { class: 'bar' }), selBar = h('div'), listBox = h('div');
    out.append(banner, notice, bar, selBar, listBox);
    let sig = '', ss = [];
    const byId = (id) => ss.find(s => s.id === id);
    const setNext = (ids) => act(async () => { await api(P('/api/next'), 'PUT', { sessions: ids }); await load(true); });
    const rollup = async (body) => {
      sf.notice = await api(P('/api/sessions/rollup'), 'POST', body);
      picked.clear(); await load(true);
    };
    const drawNotice = () => {
      const r = sf.notice;
      if (!r) return notice.replaceChildren();
      const n = byId(r.session_id)?.n ?? r.session_id;
      fill(notice, h('div', { class: 'card nextc' },
        h('b', null, `Rolled ${arr(r.sources).length} session${arr(r.sources).length === 1 ? '' : 's'} up into #${n}.`),
        r.how ? h('pre', null, str(r.how)) : null,
        h('div', { class: 'row' }, h('span', null, 'Type ', h('b', { class: 'mono' }, `#uac save ${n}`), ' in your chat to let the agent write the combined card.'),
          h('span', { style: 'flex:1' }), h('button', { onclick: () => { sf.notice = null; drawNotice(); } }, 'Dismiss'))));
    };
    const drawSel = () => {
      const ids = ss.filter(s => picked.has(s.id) && !s.rolled_into).map(s => s.id);
      if (ids.length < 2) return fill(selBar, ids.length ? h('div', { class: 'meta', style: 'margin-bottom:10px' }, '1 selected: tick another session to merge or roll up.') : null);
      if (!ids.includes(sf.into)) sf.into = ids[0];
      const target = sel(sf.into, ids.map(id => [id, `#${byId(id).n} ${sTitle(byId(id))}`]), { onchange: (e) => { sf.into = e.target.value; } });
      fill(selBar, h('div', { class: 'card banner' },
        h('b', null, `${ids.length} selected`), h('span', { class: 'meta' }, 'Merge into…'), target,
        twoStep('Merge', () => `Confirm merge ${ids.length - 1} into #${byId(target.value)?.n}`, async () => {
          const into = target.value, from = ids.filter(x => x !== into);
          const r = await api(P('/api/sessions/merge'), 'POST', { ids: from, into });
          picked.clear(); [...from, into].forEach(id => dcache.delete(id)); from.forEach(id => openCards.delete(id));
          const m = r?.moved; toast(`Merged into #${byId(into)?.n}` + (m ? ': moved ' + Object.entries(m).map(([k, v]) => `${v} ${k}`).join(', ') : ''), true);
          await load(true);
        }),
        h('button', { title: 'Create one new session whose card combines the selected cards; the sources are hidden', onclick: act(() => rollup({ ids })) }, 'Roll up into one card'),
        h('span', { style: 'flex:1' }),
        h('button', { onclick: () => { picked.clear(); load(true).catch(err => toast(err.message)); } }, 'Clear selection')));
    };
    const onPick = (id, on) => { on ? picked.add(id) : picked.delete(id); drawSel(); };
    const load = async (force) => {
      const [list, nx] = await Promise.all([api(P('/api/sessions', { all: sf.rolled ? '1' : '' })), api(P('/api/next')).catch(() => ({}))]);
      if (!live()) return;
      // never clobber an armed two-step button or a half-typed input during a background poll
      if (!force && main.querySelector('button.armed, input:not([type=checkbox]):focus, textarea:focus')) return;
      const s2 = JSON.stringify([list, nx, sf.branch, sf.rolled]);
      if (!force && s2 === sig) return;
      sig = s2; ss = list;
      // number visible (non-rolled-up) sessions only, matching `#uac continue <n>` even when all=1
      for (const id of picked) if (!byId(id) || byId(id).rolled_into) picked.delete(id);
      const nextIds = Array.isArray(nx.sessions) ? nx.sessions : ss.filter(s => s.next).map(s => s.id);
      const chosen = nextIds.map(id => ss.find(s => s.id === id) || { id, n: '?', title: id });
      fill(banner, ...(chosen.length
        ? ['Next session will continue from: ', ...chosen.map((s, i) => [i ? ', ' : '', h('b', null, `#${s.n} ${sTitle(s)}`)]).flat(), h('button', { onclick: setNext([]) }, 'clear')]
        : [h('span', null, h('b', null, 'Default: '), 'the next session continues from the latest session on the same branch.'), h('span', { class: 'meta' }, 'Tick "Continue from this" on any card to choose instead.')]));
      const branches = [...new Set(ss.map(s => s.branch).filter(Boolean))].sort();
      // server only removes empty sessions older than 30 min (a live session may not have events yet)
      const emptyN = ss.filter(s => isEmpty(s) && !s.rolled_into && Date.now() - toDate(s.started_at) > 30 * 60e3).length;
      const shown = ss.filter(s => !sf.branch || s.branch === sf.branch);
      const rollN = shown.filter(s => !s.rolled_into && s.card).length; // server rolls up carded sessions only
      fill(bar,
        sel(sf.branch, [['', 'All branches'], ...branches.map(b => [b, 'Branch ' + b])], { onchange: (e) => { sf.branch = e.target.value; load(true).catch(err => toast(err.message)); } }),
        emptyN ? twoStep(`Delete empty sessions (${emptyN})`, `Confirm delete ${emptyN} empty session${emptyN > 1 ? 's' : ''}`, async () => {
          const r = await api(P('/api/sessions/cleanup'), 'POST', { empty: true });
          toast(`Deleted ${r?.deleted ?? 0} empty session(s)`, true); await load(true);
        }) : null,
        rollN > 1 ? twoStep(sf.branch ? `Roll up all on ⎇ ${sf.branch}` : 'Roll up all sessions', `Confirm roll up ${rollN} sessions into one card`,
          () => rollup(sf.branch ? { all: true, branch: sf.branch } : { all: true }), '') : null,
        h('label', { class: 'meta' }, h('input', { type: 'checkbox', checked: sf.rolled, onchange: (e) => { sf.rolled = e.target.checked; load(true).catch(err => toast(err.message)); } }), ' Show rolled-up sessions'),
        h('span', { class: 'meta' }, `${ss.length} session${ss.length === 1 ? '' : 's'}`));
      drawNotice(); drawSel();
      listBox.replaceChildren(...(shown.length ? shown.map(s => sessionCard(s, nextIds, load, { onPick, byId })) : [empty('No sessions yet.')]));
    };
    pollFn = () => { load().catch(() => {}); updateBadge(); };
    await load(true);
  },

  async knowledge(out, live) {
    const [rv, ms] = await Promise.all([api(P('/api/review')), api(P('/api/memories', { q: kf.q }))]);
    if (!live()) return;
    updateBadge(rv);
    const reload = () => render();
    const proposed = arr(rv.proposed), conflicts = arr(rv.conflicts);

    // Accordion: every section is a <details> in one exclusive group (one open at a time). Default open: what needs you,
    // else the first knowledge group; a search opens all matching groups; the user's last choice is remembered.
    const decide = proposed.length + conflicts.length;
    const acc = (key, title, extra, kids, force) => {
      const d = h('details', { class: 'acc', name: kf.q ? null : 'uac-knowledge', open: force || kf.open === key },
        h('summary', null, h('b', null, title), extra), kids);
      d.addEventListener('toggle', () => { if (d.open) kf.open = key; else if (kf.open === key) kf.open = ''; });
      return d;
    };
    if (kf.open == null) kf.open = decide ? 'decide' : '';

    // 1. needs your decision
    out.append(acc('decide', `Needs your decision (${decide})`, decide ? pill('action needed', 'bad') : null, [
      !decide ? empty('Nothing waiting. Confident, non-conflicting items are accepted automatically.') : null,
      proposed.map(m => reviewCard(m, null, reload)),
      conflicts.map(({ memory, other }) => h('div', { class: 'split' },
        reviewCard(memory, 'New (conflicts with the existing memory)', reload), other ? memCard(other, 'Existing') : empty('(other side missing)')))]));

    // 2. project knowledge, grouped by type (items accepted automatically in the last 7 days carry a "new" pill; edit/invalidate them in place)
    let t;
    const q = h('input', { type: 'text', placeholder: 'Search knowledge…', value: kf.q, oninput: (e) => { clearTimeout(t); t = setTimeout(() => { kf.q = e.target.value; render(); }, 300); } });
    const allBox = h('label', { class: 'meta' }, h('input', { type: 'checkbox', checked: kf.all, onchange: (e) => { kf.all = e.target.checked; render(); } }), ' show invalidated / archived');
    const rows = ms.filter(m => m.status !== 'proposed' && m.status !== 'conflict' && (kf.all || (m.status !== 'superseded' && m.status !== 'archived')));
    out.append(h('h2', null, `Project knowledge (${rows.length})`), h('div', { class: 'bar' }, q, allBox));
    if (focusMem && !ms.some(m => m.id === focusMem)) {
      try { const m = await api(`/api/memories/${enc(focusMem)}`); out.append(h('h4', null, 'Linked memory'), h('div', { class: 'card' }, memRow(m, reload))); } catch {}
    }
    if (!rows.length) out.append(empty(kf.q ? 'Nothing matches.' : 'No project knowledge yet. Run /uac init in a session to seed it.'));
    const types = [...new Set([...TYPES, ...rows.map(m => m.type)])];
    const focusType = rows.find(m => m.id === focusMem)?.type;
    if (!kf.open && !decide) kf.open = 'type:' + (focusType || types.find(ty => rows.some(m => m.type === ty)));
    for (const ty of types) {
      const g = rows.filter(m => m.type === ty);
      if (!g.length) continue;
      const n = (st) => g.filter(m => m.freshness?.state === st).length;
      const scopes = [...new Set(g.map(m => m.scope))].filter(sc => sc && sc !== 'project');
      out.append(acc('type:' + ty, `${ty} (${g.length})`, [
        n('verified') ? pill('✓ ' + n('verified'), 'ok') : null, n('changed') ? pill('⚠ ' + n('changed'), 'warn') : null,
        n('missing') ? pill('✗ ' + n('missing'), 'bad') : null, g.some(m => m.status === 'archived' && /^done/.test(m.resolved_by || '')) ? pill('done: ' + g.filter(m => /^done/.test(m.resolved_by || '')).length) : null,
        scopes.map(sc => pill(sc + ' scope', 'acc'))],
        h('div', { class: 'card' }, g.map(m => memRow(m, reload))), !!kf.q || ty === focusType));
    }
    if (q.value) queueMicrotask(() => { q.focus(); q.setSelectionRange(q.value.length, q.value.length); });
  },

  async messages(out, live) {
    const [msgs, ss] = await Promise.all([api(P('/api/messages')), api(P('/api/sessions')).catch(() => [])]);
    if (!live()) return;
    const branches = [...new Set(ss.map(s => s.branch).filter(Boolean))].sort();
    const to = sel('all', [['all', 'Everyone'], ...branches.map(b => ['branch:' + b, 'Branch ' + b]),
      ...ss.slice(0, 30).map((s) => ['session:' + s.id, `Session #${s.n ?? '-'} ${s.short || s.id.slice(0, 8)} ${sTitle(s)}`])]);
    const ta = h('textarea', { rows: 3, placeholder: 'Note for other agents. It is shown once to each matching session on its next prompt.' });
    out.append(h('div', { class: 'card' }, h('h3', null, 'New message'), ta,
      h('div', { class: 'row' }, h('span', { class: 'meta' }, 'To'), to, h('button', { class: 'pri', onclick: act(async () => {
        if (!ta.value.trim()) return toast('Type a message first');
        await api(P('/api/messages'), 'POST', { text: ta.value.trim(), to: to.value }); toast('Sent', true); render();
      }) }, 'Send'))));
    // the list refreshes by itself (poll) without touching the composer, so a half-typed message survives
    const head = h('h2'), list = h('div', { class: 'msglist' });
    out.append(head, list);
    const draw = (rows) => {
      const sorted = [...rows].sort((a, b) => toDate(b.created_at) - toDate(a.created_at));
      head.textContent = `Messages (${sorted.length})`;
      list.replaceChildren(...(sorted.length ? sorted.map(m => h('div', { class: 'card msg' },
        h('div', { class: 'meta banner' }, h('b', null, [m.from_agent || 'dashboard', m.from_branch && '@' + m.from_branch].filter(Boolean).join(' ')), ' → ', str(m.recipient || m.to || 'all'),
          ' · ', ago(m.created_at), m.reads != null ? ` · read by ${Array.isArray(m.reads) ? m.reads.length : m.reads}` : '',
          h('span', { style: 'flex:1' }),
          twoStep('🗑', 'Delete?', async () => { await api(`/api/messages/${enc(m.id)}`, 'DELETE'); draw(await api(P('/api/messages'))); })),
        h('pre', null, str(m.text)))) : [empty('No messages yet.')]));
    };
    draw(msgs);
    // redraw only when something changed, and never while a 🗑 is armed (a redraw would disarm it mid-confirm)
    let sig = JSON.stringify(msgs.map(m => [m.id, m.reads]));
    pollFn = () => api(P('/api/messages')).then(r => {
      const s2 = JSON.stringify(r.map(m => [m.id, m.reads]));
      if (list.isConnected && s2 !== sig && !list.querySelector('.armed')) { sig = s2; draw(r); }
    }).catch(() => {});
  },

  async project(out, live) {
    const [x, s] = await Promise.all([api(P('/api/health')), api(P('/api/settings')).catch(() => ({})), loadProjects()]);
    if (!live()) return;
    const cur = projects.find(p => p.id === project) || {};
    const mode = s.mode ?? cur.mode ?? null;
    const saved = h('span', { class: 'meta' });
    out.append(h('div', { class: 'card' }, h('h3', null, 'Mode for ', cur.name || cur.root || project),
      mode == null ? h('div', { class: 'meta' }, 'Not chosen yet: the next session asks once (default manual).') : null,
      MODES.map(([m, desc]) => h('label', { class: 'mode' },
        h('input', { type: 'radio', name: 'mode', value: m, checked: m === mode, onchange: act(async () => { await api(P('/api/settings'), 'PUT', { mode: m }); saved.textContent = 'Saved: ' + m; }) }),
        ' ', h('b', null, m), h('span', { class: 'meta' }, desc))), saved));

    const c = x.counts || {};
    const tile = (label, n) => h('div', { class: 'tile' }, h('div', { class: 'n' }, n ?? '–'), h('div', { class: 'meta' }, label));
    out.append(h('h2', null, 'Health'), h('div', { class: 'tiles' },
      tile('sessions', x.sessions), tile('raw events', x.events),
      ['active', 'proposed', 'conflict', 'stale', 'superseded', 'archived'].map(k => tile(k + ' memories', c[k] ?? 0))));
    const db = x.db_path ?? x.db ?? x.path;
    if (db) out.append(h('div', { class: 'meta', style: 'margin-top:8px' }, 'Database: ', h('span', { class: 'mono' }, str(db))));

    out.append(h('h2', null, `Projects (${projects.length})`), h('table', null,
      h('tr', null, ['Project', 'Mode', 'Sessions', 'Memories', ''].map(t => h('th', null, t))),
      projects.map(p => {
        const others = projects.filter(o => o.id !== p.id);
        const target = sel('', [['', 'Merge into…'], ...others.map(o => [o.id, o.name || o.root])]);
        const merge = twoStep('Merge', () => {
          if (!target.value) throw new Error('pick a target');
          const o = others.find(o => o.id === target.value);
          return `Confirm merge into ${o?.name || target.value}`;
        }, async () => {
          if (!target.value) return toast('Pick a project to merge into first');
          await api('/api/projects/merge', 'POST', { from: p.id, into: target.value });
          if (project === p.id) project = target.value;
          toast('Merged', true); render();
        });
        const del = twoStep('Delete project', `Confirm delete (${p.sessions ?? '?'} sessions, ${p.memories ?? '?'} memories)`, async () => {
          await api(`/api/projects/${enc(p.id)}`, 'DELETE'); toast('Project deleted', true); render();
        });
        return h('tr', null, h('td', null, h('b', null, p.name || p.id), h('div', { class: 'meta mono' }, p.root || ''), p.git_remote ? h('div', { class: 'meta mono' }, p.git_remote) : null),
          h('td', null, p.mode || '–'), h('td', null, p.sessions ?? ''), h('td', null, p.memories ?? ''),
          h('td', null, others.length ? h('div', { class: 'row', style: 'margin:0' }, target, merge) : null, h('div', { class: 'row' }, del)));
      })));

  },
};

// ---------- sessions ----------
const isEmpty = (s) => s.empty ?? (!Number(s.events) && !s.card && !Number(s.memories_created));
function sessionCard(s, nextIds, reload, { onPick, byId }) {
  const isNext = nextIds.includes(s.id), rolled = s.rolled_into, emp = isEmpty(s);
  const titleEl = h('h3', null, sTitle(s));
  const rename = (e) => {
    e.stopPropagation();
    if (!titleEl.isConnected) return;
    const back = () => { if (inp.isConnected && !inp.disabled) inp.replaceWith(titleEl); };
    const inp = h('input', { type: 'text', class: 'ren', value: s.title || s.card?.title || '', placeholder: 'Session name', onclick: (e) => e.stopPropagation(), onblur: back,
      onkeydown: async (e) => {
        if (e.key === 'Escape') return back();
        if (e.key !== 'Enter') return;
        const t = inp.value.trim();
        if (!t) return toast('Type a name first');
        inp.disabled = true;
        try {
          await api(`/api/sessions/${enc(s.id)}`, 'PUT', { title: t });
          s.title = t; titleEl.textContent = t; inp.replaceWith(titleEl); toast('Renamed', true); await reload(true);
        } catch (err) { inp.disabled = false; inp.focus(); toast(err.message); }
      } });
    titleEl.replaceWith(inp); inp.focus(); inp.select();
  };
  const body = h('div');
  const cap = s.status === 'ended' ? pill('ended') : s.capture === 'on' ? pill('● recording', 'ok') : s.capture === 'paused' ? pill('paused', 'warn') : pill('not recording');
  const toggle = () => {
    if (openCards.has(s.id)) { openCards.delete(s.id); body.replaceChildren(); if (focusSess === s.id) focusSess = null; }
    else { openCards.add(s.id); focusSess = s.id; fillBody(s, body); }
    setHash();
  };
  const del = twoStep('Delete', async () => {
    const i = await api(`/api/sessions/${enc(s.id)}/impact`);
    const cardN = (i.summaries || 0) + (i.checkpoints || 0);
    return `Confirm delete (${i.events ?? 0} events, ${i.memories ?? 0} memories, ${cardN} card item${cardN === 1 ? '' : 's'})`;
  }, async () => {
    const r = await api(`/api/sessions/${enc(s.id)}`, 'DELETE');
    openCards.delete(s.id); dcache.delete(s.id);
    const d = r?.deleted; toast('Session deleted' + (d ? ': ' + Object.entries(d).map(([k, v]) => `${v} ${k}`).join(', ') : ''), true);
    await reload(true);
  });
  const nextIn = h('input', { type: 'checkbox', checked: isNext, onclick: (e) => e.stopPropagation(), onchange: act(async (e) => {
    const ids = e.target.checked ? [...nextIds.filter(x => x !== s.id), s.id] : nextIds.filter(x => x !== s.id);
    await api(P('/api/next'), 'PUT', { sessions: ids }); await reload(true);
  }) });
  const pickIn = rolled ? null : h('input', { type: 'checkbox', class: 'pick', title: 'Select for merge / roll up', checked: picked.has(s.id),
    onclick: (e) => e.stopPropagation(), onchange: (e) => onPick(s.id, e.target.checked) });
  const into = rolled && byId(rolled);
  const card = h('div', { class: 'card' + (isNext ? ' nextc' : '') + (emp || rolled ? ' dim' : '') + (rolled ? ' rolled' : '') + (s.id === focusSess ? ' focus' : ''), id: 's-' + s.id },
    h('div', { class: 'sh', onclick: toggle },
      pickIn,
      h('span', { class: 'n', title: 'Stable number and short id: both work in #uac continue, uac_get, uac_bootstrap' }, openCards.has(s.id) ? '▾' : '▸', s.n != null ? ' #' + s.n : '', ' ', h('span', { class: 'mono' }, s.short || s.id.slice(0, 8))),
      titleEl,
      h('button', { title: 'Rename', onclick: rename }, '✎'),
      rolled ? null : h('label', { class: 'nexttog', title: 'Load this session card into the next session (pick one or several)', onclick: (e) => e.stopPropagation() }, nextIn, 'Continue from this in next session')),
    h('div', { class: 'row', style: 'margin-top:2px' },
      h('span', { class: 'meta' }, [s.agent, s.model, s.branch && '⎇ ' + s.branch, ago(s.ended_at || s.started_at)].filter(Boolean).join(' · ')),
      cap,
      s.live ? pill('live', 'ok', 'Active in a window right now') : null,
      s.raw === false ? pill('no raw log', '', 'The host deleted its transcript: only the card and kept turns remain') : null,
      s.unsaved >= 3 ? pill(s.unsaved + ' unsaved', 'warn', 'Recorded events not in a card yet') : null,
      rolled ? h('a', { class: 'pill acc', href: '#sessions/' + enc(rolled), onclick: (e) => e.stopPropagation() }, 'rolled into ' + (into?.n != null ? '#' + into.n : rolled)) : null,
      emp ? pill('empty · can delete', 'warn', 'No events, no card, no memories') : null,
      s.card?.quality === 'auto' ? pill('auto card', 'warn', 'Built without an LLM because the session ended unsaved. Save it to refine.') : null,
      !s.card && !emp ? pill('no card') : null,
      Number(s.memories_created) > 0 ? pill(`${s.memories_created} memories`) : null,
      h('span', { style: 'flex:1' }), del),
    body);
  if (openCards.has(s.id)) fillBody(s, body);
  return card;
}

function fillBody(s, box) {
  const draw = (d) => {
    const c = s.card, ms = arr(d?.memories), evs = arr(d?.events);
    const evBox = h('div');
    const ev = evs.length ? h('details', { open: openEvents.has(s.id), ontoggle: (e) => e.target.open ? openEvents.add(s.id) : openEvents.delete(s.id) },
      h('summary', null, `Raw events (${evs.length}${evs.length >= 500 ? ', last 500' : ''})`),
      h('table', null, h('tr', null, ['Time', 'Kind', 'Tool', 'Target', 'Body'].map(t => h('th', null, t))),
        evs.map(e => h('tr', null, h('td', { class: 'meta' }, fmt(e.ts)), h('td', null, e.kind), h('td', null, e.tool), h('td', null, e.target), h('td', { class: 'ev' }, h('div', null, str(e.body))))))) : null;
    fill(box, 
      h('div', { class: 'meta', style: 'margin-top:6px' }, [s.id, s.status, fmt(s.started_at) + (s.ended_at ? ' → ' + fmt(s.ended_at) : '')].filter(Boolean).join(' · ')),
      c ? [text('Summary', c.body), text('Working', c.working), text('Broken', c.broken), list('Next steps', c.next_steps), list('Files', c.files), text('Note for next dev', c.note)]
        : empty('No card yet: this session has not been saved.'),
      ms.length ? [h('h4', null, `Memories this session created (${ms.length})`), h('ul', null, ms.map(m => h('li', null,
        h('a', { href: '#memories/' + enc(m.id) }, m.title || m.id), ' ', pill(m.type), ' ', st(m.status))))] : null,
      ev, evBox);
  };
  const cached = dcache.get(s.id);
  if (cached) draw(cached); else box.replaceChildren(empty('Loading…'));
  api(`/api/sessions/${enc(s.id)}`).then(d => { dcache.set(s.id, d); if (box.isConnected) draw(d); }).catch(e => { if (!cached) draw(null); toast(e.message); });
}

// ---------- knowledge ----------
function fresh(f) {
  const s = f?.state;
  if (s === 'verified') return pill('✓ verified', 'ok');
  if (s === 'changed') return pill(`⚠ changed ${f.commits_since ?? '?'} commit${f.commits_since === 1 ? '' : 's'}`, 'warn');
  if (s === 'missing') return pill('✗ missing', 'bad', 'Anchored file or symbol not found');
  return pill('?', '', 'Freshness unknown');
}
const anchorText = (a) => typeof a === 'string' ? a : (a.symbol ? a.symbol + '@' : '') + (a.file || '') + (a.line ? ':' + a.line : '');
const anchors = (v) => { const a = arr(v); return a.length ? h('div', { class: 'mono meta' }, a.map(anchorText).join('  ')) : null; };

function memRow(m, reload) {
  const row = h('div', { class: 'mem' + (m.id === focusMem ? ' focus' : ''), id: 'm-' + m.id });
  const put = (b) => act(async () => { m = { ...m, ...(await api(`/api/memories/${enc(m.id)}`, 'PUT', b)) }; draw(); });
  const draw = () => fill(row, 
    h('div', null, m.pinned ? '★ ' : '', h('b', null, m.title || '(untitled)'), ' ', st(m.status), fresh(m.freshness),
      m.muted ? pill('🔇 muted', 'warn', 'Never loaded') : null, m.source_model ? pill('by ' + m.source_model) : null,
      /^(auto-policy|compressor)$/.test(m.resolved_by || '') && Date.now() - toDate(m.resolved_at) < 7 * 864e5 ? pill('new', 'acc', 'Accepted automatically ' + ago(m.resolved_at) + ' by ' + m.resolved_by + '. Edit or invalidate it here if it is wrong.') : null),
    h('div', { class: 'mbody' }, str(m.body)),
    anchors(m.anchors),
    h('div', { class: 'row' },
      h('button', { class: m.pinned ? 'on' : '', title: 'Pin: always load first', onclick: put({ pinned: !m.pinned }) }, m.pinned ? '★ Pinned' : '☆ Pin'),
      h('button', { class: m.muted ? 'on' : '', title: 'Mute: keep it but never load it', onclick: put({ muted: !m.muted }) }, m.muted ? '🔇 Muted' : '🔇 Mute'),
      h('button', { title: 'Still true: mark verified at the current commit', onclick: act(async () => { m = { ...m, ...(await api(`/api/memories/${enc(m.id)}/verify`, 'POST', {})) }; draw(); toast('Verified', true); }) }, '✓ Verify'),
      h('button', { onclick: edit }, 'Edit'),
      m.status !== 'superseded' ? twoStep('Invalidate', 'Confirm invalidate', async () => { await api(`/api/memories/${enc(m.id)}`, 'PUT', { status: 'superseded' }); reload(); }) : null,
      twoStep('Delete', 'Confirm delete forever', async () => { await api(`/api/memories/${enc(m.id)}`, 'DELETE'); reload(); }),
      h('span', { class: 'meta' }, [m.source_agent, m.branch && '⎇ ' + m.branch, 'updated ' + ago(m.updated_at)].filter(Boolean).join(' · '))));
  function edit() {
    const f = {
      title: h('input', { type: 'text', value: m.title ?? '' }),
      body: h('textarea', { rows: 6 }, m.body ?? ''),
      why: h('textarea', { rows: 2 }, m.why ?? ''),
      type: sel(m.type, [...new Set([...TYPES, m.type].filter(Boolean))]),
      anchors: h('textarea', { rows: 3, placeholder: '[{"file":"src/x.js","symbol":"fn","line":42}]' }, JSON.stringify(arr(m.anchors), null, 1)),
    };
    const err = h('span', { class: 'meta', style: 'color:var(--bad)' });
    row.replaceChildren(h('div', { class: 'grid' },
      h('span', null, 'Title'), f.title, h('span', null, 'Body'), f.body, h('span', null, 'Why'), f.why,
      h('span', null, 'Type'), h('div', null, f.type), h('span', null, 'Anchors'), f.anchors),
      h('div', { class: 'row' }, h('button', { class: 'pri', onclick: act(async () => {
        let an;
        try { an = f.anchors.value.trim() ? JSON.parse(f.anchors.value) : []; if (!Array.isArray(an)) throw 0; } catch { err.textContent = 'Anchors must be a JSON array'; return; }
        m = { ...m, ...(await api(`/api/memories/${enc(m.id)}`, 'PUT', { title: f.title.value, body: f.body.value, why: f.why.value, type: f.type.value, anchors: an })) };
        draw();
      }) }, 'Save'), h('button', { onclick: draw }, 'Cancel'), err));
    f.title.focus();
  }
  draw();
  return row;
}

function memCard(m, label) {
  return h('div', { class: 'card' },
    label ? h('div', { class: 'meta' }, label) : null,
    h('h3', null, m.title || '(untitled)'),
    h('div', { class: 'meta' }, m.type, ' · ', st(m.status), m.source_model ? ' · by ' + m.source_model : m.source_agent ? ' · ' + m.source_agent : '',
      m.confidence != null ? ' · confidence ' + m.confidence : '', ' · ', ago(m.created_at)),
    h('pre', null, str(m.body)), text('Why', m.why), anchors(m.anchors), list('Files', m.files));
}

function reviewCard(m, label, reload) {
  const card = memCard(m, label);
  const resolve = (action, body) => act(async () => {
    await api(`/api/memories/${enc(m.id)}/resolve`, 'POST', body !== undefined ? { action, body } : { action });
    reload();
  });
  const row = h('div', { class: 'row' },
    h('button', { class: 'pri', onclick: resolve('accept') }, 'Accept'),
    h('button', { class: 'dng', onclick: resolve('reject') }, 'Reject'),
    h('button', { onclick: () => {
      const ta = h('textarea', { rows: 6 }, m.body ?? '');
      row.replaceWith(h('div', null, ta, h('div', { class: 'row' },
        h('button', { class: 'pri', onclick: (e) => resolve('accept', ta.value)(e) }, 'Accept edited'), h('button', { onclick: reload }, 'Cancel'))));
      ta.focus();
    } }, 'Edit + accept'));
  card.append(row);
  return card;
}

// ---------- boot ----------
setInterval(() => { if (!document.hidden && project && pollFn) pollFn(); }, 5000); // sessions + messages tabs keep themselves current
document.getElementById('refresh').onclick = act(async () => { await loadProjects(); updateBadge(); await render(); toast('Refreshed', true); });
(async () => {
  drawTabs();
  if (!TOKEN) toast('No token in URL (?t=…). Open the link printed by `uac view`.');
  try { await loadProjects(); } catch (e) { main.replaceChildren(empty(e.message)); return; }
  updateBadge();
  render();
})();
</script>
</body>
</html>
